name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build engine/build --config Release
      - name: Test
        run: ctest --test-dir engine/build -C Release --output-on-failure

  engine-sanitizers:
    name: Engine (address + undefined-behavior checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Debug -DHUSH_SANITIZE=ON
      - run: cmake --build engine/build
      - run: ./engine/build/hush_tests

  bench:
    name: Bench scoring logic (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bench/requirements.txt
      - run: cd bench && python -m pytest -q tests
      - name: Model loads and runs on a synthetic clip
        run: |
          cd bench && python - <<'PY'
          import numpy as np
          from hush_bench.detectors.model import ModelDetector
          x = (np.random.default_rng(0).standard_normal(16000 * 3) * 0.01).astype(np.float32)
          p = ModelDetector().probs(x, 16000)
          assert p.shape[0] > 0 and 0 <= p.min() and p.max() <= 1
          print("model OK:", len(p), "frames")
          PY

  extension:
    name: Chrome extension (WebAssembly engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang and the WebAssembly linker
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Build hush.wasm from the C++ engine
        run: ./extension/build.sh
      - name: Build the native engine (reference for parity)
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release && cmake --build engine/build
      - name: Mic wrapper never breaks the call (fake browser)
        run: node extension/test/inject.test.mjs
      - name: Browser engine matches native engine
        run: |
          pip install numpy scipy
          mkdir -p /tmp/wavs && python extension/test/make_wavs.py /tmp/wavs
          node extension/test/parity.mjs /tmp/wavs/*.wav
      - name: Manifest is valid JSON and scripts parse
        run: |
          python -c "import json; json.load(open('extension/manifest.json'))"
          for f in extension/*.js; do node --check "$f"; done
